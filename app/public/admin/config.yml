# =============================================================================
# Decap CMS configuration — efiamerikana
# =============================================================================
# Backend: GitHub. Production editorial access additionally needs an OAuth
# gateway in front of GitHub (see README "CMS authentication").
# Local development: `npm run admin` (decap-server) + local_backend.
#
# IA notes (keep the sidebar tiny — 3 entries + Media):
#   - Videos / Pictures: folder collections, one entry per item.
#   - Page Sections: ONE files-collection holding every editable section of
#     the landing page, in page order. Greek (el) files are intentionally
#     absent — the site currently publishes English only; re-add *-el.json
#     files here when Greek goes live.
#
# media_folder MUST be set on every collection: folder collections without
# it browse/upload to their own entry folder, hiding the shared library in
# the picker (that is how uploads once ended up stranded in src/content/).
# =============================================================================

backend:
  name: github
  repo: ngeran/efiamerikana
  branch: main

local_backend: true # requires `npm run admin` while developing locally

site_url: https://efiamerikana.com
display_url: https://efiamerikana.com
logo_url: /favicon.svg

media_folder: src/assets/media
public_folder: /media

locale: en

publish_mode: simple

collections:
  # ── Content ──────────────────────────────────────────────────────────────
  - name: videos
    label: 🎬 Videos
    label_singular: Video
    folder: src/content/videos
    media_folder: /src/assets/media
    public_folder: /media
    path: '{{slug}}'
    create: true
    sortable_fields: [order, title]
    summary: '{{title}} · {{language}}'
    editor:
      preview: true
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - {
          label: Video file,
          name: video,
          widget: file,
          required: true,
          hint: 'MP4 (H.264) portrait — the only required field',
          choose_url: false,
        }
      - {
          label: Title,
          name: title,
          widget: string,
          required: false,
          hint: Shows on the card when expanded,
        }
      - { label: Description, name: description, widget: text, required: false }
      - {
          label: Language,
          name: language,
          widget: select,
          options: [en, el],
          default: 'en',
          hint: 'The site currently publishes English only',
        }
      - {
          label: Order,
          name: order,
          widget: number,
          default: 100,
          hint: Lower numbers appear first,
        }
      - {
          label: Tag,
          name: tag,
          widget: string,
          required: false,
          hint: 'Optional chip (e.g. TikTok)',
        }
      - { label: 'Draft — hidden from the live site', name: draft, widget: boolean, default: false }

  - name: pictures
    label: 🖼️ Pictures
    label_singular: Picture
    folder: src/content/pictures
    media_folder: /src/assets/media
    public_folder: /media
    path: '{{slug}}'
    create: true
    sortable_fields: [order, title]
    summary: '{{title}} · {{language}}'
    editor:
      preview: true
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - {
          label: Image,
          name: image,
          widget: image,
          required: true,
          hint: 'The only required field',
          choose_url: false,
        }
      - {
          label: Title,
          name: title,
          widget: string,
          required: false,
          hint: Shows on the card when expanded,
        }
      - {
          label: Alt text,
          name: imageAlt,
          widget: string,
          required: false,
          hint: 'Short description for screen readers — falls back to the title',
        }
      - { label: Description, name: description, widget: text, required: false }
      - {
          label: Language,
          name: language,
          widget: select,
          options: [en, el],
          default: 'en',
          hint: 'The site currently publishes English only',
        }
      - {
          label: Order,
          name: order,
          widget: number,
          default: 100,
          hint: Lower numbers appear first,
        }
      - { label: 'Draft — hidden from the live site', name: draft, widget: boolean, default: false }

  # ── The landing page itself, in page order ───────────────────────────────
  - name: pagesections
    label: ✏️ Page Sections
    label_singular: Section
    editor:
      preview: false
    files:
      - name: hero
        label: 🟡 Hero — top banner
        file: src/content/sections/hero.en.json
        fields:
          - { label: Small label above the heading, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - {
              label: 'Heading accent (italic second line)',
              name: headingAccent,
              widget: string,
              required: false,
            }
          - { label: Supporting text, name: supporting, widget: text }
          - { label: Hero image, name: image, widget: image }
          - { label: Image alt text, name: imageAlt, widget: string }
          - {
              label: Layout,
              name: variant,
              widget: select,
              options: [split, center],
              default: split,
              hint: split = image beside text · center = stacked,
            }
          - label: Primary button
            name: primaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string, hint: '#videos / #contact or a URL' }
          - label: Secondary button
            name: secondaryCta
            widget: object
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }

      - name: video-section
        label: 🎬 Videos — section settings
        file: src/content/sections/video-section.en.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - {
              label: Layout,
              name: layout,
              widget: select,
              options: [grid, scroll],
              default: grid,
              hint: grid = responsive grid · scroll = swipeable rail,
            }
          - {
              label: Show details (+) button on cards,
              name: showDetailsButton,
              widget: boolean,
              default: true,
            }

      - name: picture-section
        label: 🖼️ Pictures — section settings
        file: src/content/sections/picture-section.en.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - {
              label: Layout,
              name: layout,
              widget: select,
              options: [grid, scroll],
              default: grid,
              hint: grid = responsive grid · scroll = swipeable rail,
            }
          - {
              label: Show details (+) button on cards,
              name: showDetailsButton,
              widget: boolean,
              default: false,
            }
          - {
              label: Show metadata on hover,
              name: enableHoverPreview,
              widget: boolean,
              default: false,
            }
          - {
              label: Show metadata on click,
              name: enableClickToReveal,
              widget: boolean,
              default: false,
            }

      - name: about
        label: 📖 About — my story
        file: src/content/sections/about.en.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - label: Paragraphs
            name: paragraphs
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Pull quote, name: pullQuote, widget: string, required: false }
          - { label: Featured image, name: image, widget: image }
          - { label: Image alt text, name: imageAlt, widget: string }
          - label: Button
            name: cta
            widget: object
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }

      - name: analytics
        label: 📊 Analytics — stats
        file: src/content/sections/analytics.en.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - {
              label: Footnote,
              name: footnote,
              widget: text,
              required: false,
              hint: Disclaimer under the metrics,
            }
          - label: Metrics
            name: metrics
            label_singular: Metric
            widget: list
            fields:
              - { label: Value, name: value, widget: string, hint: 'e.g. 1.2M, 14%' }
              - { label: Label, name: label, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - {
                  label: Icon,
                  name: icon,
                  widget: select,
                  required: false,
                  options: [heart, users, star, globe, play, chart, sparkle],
                  default: sparkle,
                }

      - name: contact
        label: ✉️ Contact
        file: src/content/sections/contact.en.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Button label, name: ctaLabel, widget: string }
          - label: Contact methods
            name: methods
            label_singular: Method
            widget: list
            hint: The first email method feeds the header email icon.
            fields:
              - {
                  label: Icon,
                  name: icon,
                  widget: select,
                  options: [email, phone, location, link],
                  default: email,
                }
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
              - {
                  label: Link,
                  name: href,
                  widget: string,
                  required: false,
                  hint: 'mailto:/tel:/URL',
                }
          - label: Social links
            name: socials
            label_singular: Social
            widget: list
            fields:
              - {
                  label: Icon,
                  name: icon,
                  widget: select,
                  options: [tiktok, instagram, facebook, youtube, x],
                  default: instagram,
                }
              - { label: Label, name: label, widget: string }
              - { label: URL, name: href, widget: string }

      - name: footer
        label: 🦶 Footer
        file: src/content/sections/footer.en.json
        fields:
          - { label: '"How to use" link label', name: howToUseLabel, widget: string }
          - { label: Note, name: note, widget: string, required: false }

      - name: settings
        label: ⚙️ Site settings & section order
        file: src/content/sections/settings.en.json
        fields:
          - { label: Site title, name: siteTitle, widget: string }
          - {
              label: Site description,
              name: siteDescription,
              widget: text,
              hint: Used for the meta description and Open Graph,
            }
          - label: Sections
            name: sections
            label_singular: Section
            widget: list
            hint: Order defines page order; disabled sections do not render.
            fields:
              - {
                  label: Section,
                  name: id,
                  widget: select,
                  options: [hero, videos, pictures, about, analytics, contact, footer],
                }
              - { label: Enabled, name: enabled, widget: boolean, default: true }
              - { label: Nav label, name: navLabel, widget: string }
