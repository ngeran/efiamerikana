# Sveltia/Decap CMS config — Efi Amerikana
# Git-based: edits commit to GitHub → the Cloudflare Pages Action rebuilds the site.
#
# BEFORE FIRST USE — fill in these two (see cms-oauth/README.md):
#   base_url : your deployed OAuth Worker URL (https://…workers.dev)
#   app_id   : the Client ID of the GitHub OAuth App you created
backend:
  name: github
  repo: ngeran/efiamerikana
  branch: main
  base_url: https://efiamerikana-cms-oauth.ngeran.workers.dev
  auth_endpoint: /auth
  app_id: Ov23licpD5ptuMAlcOPt

# No editorial_workflow → every save commits straight to main (instant deploy).
site_url: https://efiamerikana.pages.dev

# CMS uploads land in the repo here and are served from this URL path.
media_folder: "site/static/img"
public_folder: "/img"

collections:
  # ── Videos ──────────────────────────────────────────────────────
  - name: "videos"
    label: "Videos"
    label_singular: "Video"
    folder: "content/videos"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{category}} ({{views}})"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Views", name: "views", widget: "string", required: false }
      - { label: "Duration", name: "duration", widget: "string", required: false }
      - { label: "Cover image", name: "image", widget: "image", required: false }
      - { label: "Embed URL (iframe)", name: "embed_url", widget: "string", required: false }
      - { label: "External watch URL", name: "external_url", widget: "string", required: false }
      - { label: "Short description", name: "description", widget: "string", required: false }
      - { label: "Body (notes)", name: "body", widget: "markdown", required: false }

  # ── Pictures ────────────────────────────────────────────────────
  - name: "pictures"
    label: "Pictures"
    label_singular: "Picture"
    folder: "content/pictures"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  # ── Pages (single-file sections) ────────────────────────────────
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - label: "About"
        name: "about"
        file: "content/about/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline accent", name: "headline_accent", widget: "string" }
          - { label: "Established", name: "est", widget: "string", required: false }
          - { label: "Philosophy label", name: "philosophy_label", widget: "string", required: false }
          - { label: "Philosophy", name: "philosophy", widget: "string", required: false }
          - { label: "Signature label", name: "signature_label", widget: "string", required: false }
          - { label: "Signature", name: "signature", widget: "string", required: false }
          - { label: "Portrait image", name: "image", widget: "image" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact"
        name: "contact"
        file: "content/contact/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Portrait image", name: "image", widget: "image", required: false }
          - { label: "Body", name: "body", widget: "markdown", required: false }

  # ── Home & site-wide content → data/site.yaml (single source for editable copy) ──
  - name: "home"
    label: "Home & Site"
    delete: false
    files:
      - label: "Home & Site content"
        name: "site"
        file: "data/site.yaml"
        fields:
          - { label: "Brand", name: "brand", widget: "string" }
          - { label: "Creator name", name: "creator", widget: "string" }
          - { label: "Handle", name: "handle", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Subtagline", name: "subtagline", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "string" }
          - { label: "Established", name: "est", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Hero image", name: "hero_image", widget: "image" }
          - label: "Social links"
            name: "social"
            widget: "list"
            min: 1
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Material icon", name: "icon", widget: "string", required: false }
          - { label: "Footer tagline", name: "footer_tagline", widget: "string" }
          - label: "Navigation menu"
            name: "menu"
            widget: "list"
            fields:
              - { label: "Label", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Order", name: "weight", widget: "number" }

  # ── Analytics dashboard numbers → data/analytics.yaml ──
  - name: "analytics"
    label: "Analytics"
    delete: false
    files:
      - label: "Dashboard numbers"
        name: "analytics"
        file: "data/analytics.yaml"
        fields:
          - label: "Metrics"
            name: "metrics"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Delta", name: "delta", widget: "string" }
              - { label: "Tone", name: "tone", widget: "select", options: ["pink", "red"], default: "red" }
              - { label: "Icon", name: "icon", widget: "string" }
          - label: "Growth"
            name: "growth"
            widget: "object"
            fields:
              - { label: "Period", name: "period", widget: "string" }
              - label: "X-axis labels"
                name: "x_labels"
                widget: "list"
                default: ["JUL", "AUG", "SEP", "OCT", "NOV", "DEC"]
          - label: "Platforms"
            name: "platforms"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Share %", name: "share", widget: "number" }
              - { label: "Tone", name: "tone", widget: "select", options: ["pink", "red", "variant"], default: "variant" }
          - label: "Geo"
            name: "geo"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Regions"
                name: "regions"
                widget: "list"
                fields:
                  - { label: "Country", name: "country", widget: "string" }
                  - { label: "Share", name: "share", widget: "string" }
