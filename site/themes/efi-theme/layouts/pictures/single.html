{{ define "main" }}
<article class="max-w-7xl mx-auto w-full px-5 md:px-16 py-12 md:py-20">
  <div class="max-w-3xl mx-auto flex flex-col gap-6">
    <a class="label-bold text-variant hover:text-ink" href="/pictures/">← Back to pictures</a>
    <h1 class="text-headline-xl">{{ .Title }}</h1>
    <div class="flex flex-wrap items-center gap-4">
      {{- with .Params.category }}<span class="chip">{{ . }}</span>{{- end }}
      {{- with .Params.date }}<span class="label-sm text-variant">{{ . | time.Format "January 2, 2006" }}</span>{{- end }}
    </div>

    <figure class="aspect-[4/5] max-w-xs overflow-hidden rounded-lg border-2 border-ink">
      {{ partial "img.html" (dict "page" . "image" .Params.image "alt" .Title) }}
    </figure>

    {{- with .Params.caption }}<p class="text-body-lg text-variant italic">{{ . }}</p>{{- end }}
    {{- with .Content }}<div class="text-body-lg text-variant">{{ . }}</div>{{- end }}
  </div>
</article>
{{ end }}
