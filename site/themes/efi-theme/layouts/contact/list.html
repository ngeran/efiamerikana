{{ define "main" }}
<section class="max-w-7xl mx-auto w-full px-5 md:px-16 py-12 md:py-24">
  <div class="grid grid-cols-1 md:grid-cols-12 gap-12 items-center">

    {{/* Media: portrait with rotated pink backer + hard red shadow */}}
    <div class="md:col-span-6">
      <div class="relative w-full max-w-xs mx-auto md:mx-0">
        <div class="absolute -inset-4 border-2 border-pink-deep rotate-3" aria-hidden="true"></div>
        <div class="relative w-full aspect-[4/5] bg-ink overflow-hidden rounded-lg border-2 border-ink">
          {{- with .Params.image }}
          <img class="w-full h-full object-cover" src="{{ . }}" alt="{{ $.Site.Params.creator }}" loading="lazy">
          {{- end }}
        </div>
      </div>
    </div>

    {{/* Content */}}
    <div class="md:col-span-6 flex flex-col gap-10 md:gap-12">
      <div class="flex items-start gap-6">
        <span class="w-1.5 h-24 bg-tertiary mt-2 shrink-0" aria-hidden="true"></span>
        <div>
          <span class="eyebrow mb-4 block">Contact</span>
          <h1 class="text-headline-xl">Get in<br><em class="text-pink-dark italic">Touch.</em></h1>
        </div>
      </div>

      <div class="flex flex-col gap-4">
        <span class="label-bold text-variant uppercase tracking-widest">Direct Email</span>
        <a class="text-headline-md underline decoration-tertiary decoration-4 underline-offset-8 transition-colors hover:text-pink-dark break-words"
           href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      </div>

      <div class="flex flex-col gap-6">
        <span class="label-bold text-variant uppercase tracking-widest">Follow the Vibe</span>
        <div class="flex flex-wrap gap-4">
          {{- range .Site.Params.social }}
          <a class="flex items-center gap-3 px-6 py-3 border-2 border-ink label-bold uppercase transition-all hover:bg-ink hover:text-saffron"
             href="{{ .url }}" target="_blank" rel="me noopener">
            <span class="material-symbols-outlined" aria-hidden="true">{{ .icon }}</span>{{ .name }}
          </a>
          {{- end }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
