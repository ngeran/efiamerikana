name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Build Hugo site with Nix
        # Offline + reproducible. Leaves ./result → the built static site
        # (Hugo only; Tailwind CSS is precompiled and committed, no Node needed).
        run: nix build .#site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler follows the ./result symlink (same path `just cf` uploads).
          command: pages deploy ./result --project-name=efiamerikana --branch=main
